services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: lerix-9router_server_1
      APP_PORT: 20128

  server:
    image: decolua/9router:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      # Umbrel injects APP_PASSWORD (per-install deterministic) — wire it to
      # 9router's INITIAL_PASSWORD so the auto-generated password works on
      # first login. Ignored once the user changes the password in-dashboard.
      INITIAL_PASSWORD: ${APP_PASSWORD}
      TZ: UTC
    volumes:
      - "${APP_DATA_DIR}/data:/app/data"
