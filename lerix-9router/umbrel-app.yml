manifestVersion: 1
id: lerix-9router
name: 9Router
tagline: Local AI gateway with OpenAI-compatible API
icon: https://raw.githubusercontent.com/decolua/9router/master/images/9router.png
category: AI
version: "0.5.104"
port: 20128
description: >-
  9Router is a local AI gateway and dashboard. It routes CLI/IDE traffic
  across AI providers with automatic fallback, exposes an OpenAI-compatible
  API on /v1, and provides a web dashboard on /dashboard for monitoring and
  configuration.


  State (SQLite database + backups) is persisted to the Umbrel data directory
  via /app/data. Updates follow the standard Umbrel app update flow.


  Login password is generated automatically by Umbrel on install and shown
  on the app's credentials screen. Change it any time from the dashboard.
developer: decolua
website: https://9router.com
submitter: Tomáš Kalina
submission: https://github.com/TomKalina/umbrel-community-app-store
repo: https://github.com/decolua/9router
support: https://github.com/decolua/9router/issues
gallery: []
releaseNotes: >-
  Updates 9Router from 0.5.55 to 0.5.104 and pins the image, so future
  versions arrive through the Umbrel update flow.


  - Dashboard session now expires after 24 hours

  - Removed duplicate "qwen" provider and retired Antigravity 3.5/3-flash and
  Codex gpt-5.5 models; update combos that use them

  - /responses now requires an API key

  - Search requests to self-hosted backends on the LAN (e.g. SearXNG) are
  blocked by SSRF protection
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
