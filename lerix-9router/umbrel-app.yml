manifestVersion: 1
id: lerix-9router
name: 9Router
tagline: Local AI gateway with OpenAI-compatible API
icon: https://raw.githubusercontent.com/decolua/9router/master/images/9router.png
category: AI
version: "0.5.55"
port: 20128
description: >-
  9Router is a local AI gateway and dashboard. It routes CLI/IDE traffic
  across AI providers with automatic fallback, exposes an OpenAI-compatible
  API on /v1, and provides a web dashboard on /dashboard for monitoring and
  configuration.


  State (SQLite database + backups) is persisted to the Umbrel data directory
  via /app/data. Updates follow the standard Umbrel app update flow.


  Login password is generated automatically by Umbrel on install and shown
  on the app's credentials screen. Change it any time from the dashboard.
developer: decolua
