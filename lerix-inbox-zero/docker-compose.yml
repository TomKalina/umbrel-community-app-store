services:
  app_proxy:
    environment:
      APP_HOST: lerix-inbox-zero_web_1
      APP_PORT: 3000
      # Gmail Pub/Sub and Microsoft Graph push notifications cannot send Umbrel
      # auth cookies. Both endpoints verify their own token/client state.
      PROXY_AUTH_WHITELIST: "/api/google/webhook,/api/outlook/webhook"

  web:
    image: ghcr.io/elie222/inbox-zero:6cdf759@sha256:9c61d54b9c8c73b72e0c35ab339bae011329444abd8c5f2c62bb9fd65225ae5f
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      redis-http:
        condition: service_started
    environment:
      # Must be the public HTTPS URL (e.g. via Cloudflare Tunnel) for Google/Microsoft OAuth.
      NEXT_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:3290
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
      NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
      DATABASE_URL: postgresql://inboxzero:${APP_LERIX_INBOX_ZERO_DB_PASSWORD}@lerix-inbox-zero_db_1:5432/inboxzero?schema=public
      DIRECT_URL: postgresql://inboxzero:${APP_LERIX_INBOX_ZERO_DB_PASSWORD}@lerix-inbox-zero_db_1:5432/inboxzero?schema=public
      REDIS_HTTP_URL: http://lerix-inbox-zero_redis-http_1:80
      REDIS_HTTP_TOKEN: ${APP_LERIX_INBOX_ZERO_REDIS_HTTP_TOKEN}
      # Live mailbox updates (/api/mail-stream) use Redis pub/sub directly.
      REDIS_URL: redis://:${APP_LERIX_INBOX_ZERO_REDIS_PASSWORD}@lerix-inbox-zero_redis_1:6379
      INTERNAL_API_URL: http://lerix-inbox-zero_web_1:3000
      AUTH_SECRET: ${APP_LERIX_INBOX_ZERO_AUTH_SECRET}
      # Never change after first start: stored OAuth tokens are encrypted with these.
      EMAIL_ENCRYPT_SECRET: ${APP_LERIX_INBOX_ZERO_EMAIL_ENCRYPT_SECRET}
      EMAIL_ENCRYPT_SALT: ${APP_LERIX_INBOX_ZERO_EMAIL_ENCRYPT_SALT}
      INTERNAL_API_KEY: ${APP_LERIX_INBOX_ZERO_INTERNAL_API_KEY}
      API_KEY_SALT: ${APP_LERIX_INBOX_ZERO_API_KEY_SALT}
      CRON_SECRET: ${APP_LERIX_INBOX_ZERO_CRON_SECRET}
      MICROSOFT_WEBHOOK_CLIENT_STATE: ${APP_LERIX_INBOX_ZERO_MICROSOFT_WEBHOOK_CLIENT_STATE}
      # Placeholders so the app boots before the user configures a provider in
      # Umbrel app settings. "skipped" disables the provider upstream.
      GOOGLE_CLIENT_ID: skipped
      GOOGLE_CLIENT_SECRET: skipped
      GOOGLE_PUBSUB_TOPIC_NAME: projects/unset/topics/unset
      DEFAULT_LLMS: anthropic:claude-sonnet-5

  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    user: "1000:1000"
    restart: on-failure
    environment:
      POSTGRES_USER: inboxzero
      POSTGRES_PASSWORD: ${APP_LERIX_INBOX_ZERO_DB_PASSWORD}
      POSTGRES_DB: inboxzero
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxzero -d inboxzero"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    user: "1000:1000"
    restart: on-failure
    command: redis-server --requirepass ${APP_LERIX_INBOX_ZERO_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data

  redis-http:
    image: hiett/serverless-redis-http:0.0.10@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
    restart: on-failure
    depends_on:
      - redis
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${APP_LERIX_INBOX_ZERO_REDIS_HTTP_TOKEN}
      SRH_CONNECTION_STRING: redis://:${APP_LERIX_INBOX_ZERO_REDIS_PASSWORD}@lerix-inbox-zero_redis_1:6379

  # Mirrors upstream docker-compose.yml cron service.
  cron:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: on-failure
    command: >
      sh -c "
        apk add --no-cache curl &&
        until curl -fs -o /dev/null http://lerix-inbox-zero_web_1:3000/; do echo \"[cron] Waiting for web...\"; sleep 5; done && {
        (
          while true; do
            echo \"[cron] Processing scheduled actions...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: scheduled-actions request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing automation jobs...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: automation-jobs request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing follow-up reminders...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: follow-up-reminders request failed\"
            sleep 3600
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing digest emails...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: digest request failed\"
            sleep 1800
          done
        ) &
        (
          while true; do
            echo \"[cron] Processing meeting briefs...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: meeting-briefs request failed\"
            sleep 900
          done
        ) &
        (
          while true; do
            echo \"[cron] Scheduling meeting recorder bots...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/meeting-recorder/schedule' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: meeting-recorder request failed\"
            sleep 300
          done
        ) &
        (
          while true; do
            echo \"[cron] Renewing email watches...\"
            curl -s -X GET 'http://lerix-inbox-zero_web_1:3000/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: watch request failed\"
            sleep 21600
          done
        ) &
        (
          sleep 300
          while true; do
            for job in reasoning-retention mobile-push-retention email-send-operation-retention draft-cleanup; do
              echo \"[cron] Running $${job}...\"
              curl -fsS -X GET \"http://lerix-inbox-zero_web_1:3000/api/cron/$${job}\" -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: $${job} request failed\"
            done
            sleep 86400
          done
        ) &
        (
          sleep 300
          while true; do
            echo \"[cron] Sending inbox health emails...\"
            curl -fsS -X GET 'http://lerix-inbox-zero_web_1:3000/api/resend/inbox-health/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: inbox-health request failed\"
            sleep 86400
          done
        ) &
        (
          sleep 300
          while true; do
            echo \"[cron] Sending weekly summary emails...\"
            curl -fsS -X GET 'http://lerix-inbox-zero_web_1:3000/api/resend/summary/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[cron] Warning: summary request failed\"
            sleep 604800
          done
        ) &
        wait
        }
      "
    environment:
      CRON_SECRET: ${APP_LERIX_INBOX_ZERO_CRON_SECRET}
    depends_on:
      - web
